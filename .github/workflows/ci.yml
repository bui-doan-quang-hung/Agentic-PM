name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sticky_notes_test
          POSTGRES_USER: sticky_test
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sticky_test -d sticky_notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sticky_test:ci_ephemeral_password@localhost:5432/sticky_notes_test
      TEST_DATABASE_URL: postgresql+psycopg://sticky_test:ci_ephemeral_password@localhost:5432/sticky_notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL service authentication
        env:
          POSTGRES_PASSWORD: ci_ephemeral_password
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U sticky_test -d sticky_notes_test
          PGPASSWORD="$POSTGRES_PASSWORD" psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U sticky_test \
            -d sticky_notes_test \
            -c "SELECT current_user, current_database(), version();"
      - name: Run backend tests
        run: python -m pytest backend/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
